# Alembic configuration. Run every `alembic` command from the `backend/` directory.

[alembic]
# Migration scripts, relative to the working directory.
script_location = alembic

# Lets env.py import the `app` package even when it is not installed.
prepend_sys_path = .
path_separator = os

# The database URL is deliberately not set here: env.py takes it from the application
# settings (the `DATABASE_URL` environment variable, or a `.env` file).

# Logging configuration, applied by env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
