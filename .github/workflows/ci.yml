name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch or pull request cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing major version tags in v8: the full release tag is the
      # reference its maintainers recommend (https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0).
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check the format (ruff)
        run: uv run ruff format --check .

      # Without a path, mypy checks every directory that pyproject.toml lists: app, scripts, alembic
      # and tests.
      - name: Type-check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (svelte-check, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Test (vitest)
        run: npm test

      - name: Production build
        run: npm run build
